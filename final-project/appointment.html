    <header>

    </header>
    <main>
        <div>
            <form action="thankyou.html" method="GET">

                <h1>Appointment Form</h1>
                <label for="fname">First name:<br>
                    <input required type="text" id="fname" name="fname" autocomplete="given-name"></label><br>
                <label for="lname">Last name:</label><br>
                <input required type="text" id="lname" name="lname" autocomplete="family-name"><br>

                <label for="email">Email:</label><br>
                <input required name="email" id="email" type="email" autocomplete="off" placeholder="example@gmail.com"
                    title="Enter your Email"><br>

                <label for="phone">Phone:</label><br>
                <input required name="phone" id="phone" type="tel" autocomplete="tel" title="Enter your phone"><br>

                <label for="membership">Reason:</label><br>
                <select required name="membership" id="membership" title="Enter your membership">
                    <option value="" disabled selected>Select an option</option>
                    <option value="consult">Consult</option>
                    <option value="Product">Buy Product</option>
                    <option value="vaccinations">Vaccinations</option>
                    <option value="screenings">Health Screenings:</option>
                </select>
                <br>

                <label for="date">Intended date:<input required type="date" id="date" name="date"></label>
                <br>
                <label for="hour">Intended hour: <input required type="time" id="hour" name="hour"></label>
                <br>
                <input hidden name="timestamp" id="timestamp"><br>
                <button type="submit" value="Submit">Join</button>



            </form>
        </div>
